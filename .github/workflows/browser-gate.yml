name: M3 browser gate

# A browser-only verification runner for the M3 gate. The sandbox cannot download
# WebKit. The complete ordered CI/CD + Pages workflow is deliberately M7 work.
on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-gate-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
